name: 打包桌面应用

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }} 桌面应用
    runs-on: ${{ matrix.runner }}
    # 安全网：正常构建（含全部大文件下载）应在 20 分钟内完成，
    # 超时说明有步骤挂起，快速失败而不是烧满 6 小时平台上限。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            platform: macos
            runner: macos-latest
            command: pnpm desktop:make
            artifact_name: zhihu-article-to-video-macos
            artifact_path: apps/desktop/out/darwin/ZhihuArticleToVideo-macos-arm64.dmg
          - name: Windows
            platform: windows
            runner: windows-latest
            command: pnpm desktop:make:win32
            artifact_name: zhihu-article-to-video-windows
            artifact_path: apps/desktop/out/win32/ZhihuArticleToVideo-win32-x64-Setup.exe

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 设置 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile --prod=false

      - name: 安装 NSIS（Windows）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $preinstalled = "C:\Program Files (x86)\NSIS"
          if (Test-Path (Join-Path $preinstalled "makensis.exe")) {
            Add-Content $env:GITHUB_PATH $preinstalled
            Write-Host "NSIS 已加入 PATH"
          } else {
            # windows-latest 镜像已不预装 NSIS；choco 的 community feed 曾持续
            # 503。Expand-Archive 在 runner 的 pwsh 7 上有 .NET 类型加载故障，
            # 改用系统 curl.exe + bsdtar 解压 SourceForge 官方便携压缩包。
            $version = "3.12"
            $installDir = Join-Path $env:RUNNER_TEMP "nsis"
            $zipPath = Join-Path $env:RUNNER_TEMP "nsis.zip"
            New-Item -ItemType Directory -Force $installDir | Out-Null
            curl.exe -fSL --retry 3 --retry-delay 2 -o $zipPath "https://downloads.sourceforge.net/nsis/nsis-$version.zip"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "NSIS 压缩包下载失败（curl 退出码 $LASTEXITCODE）。"
              exit 1
            }
            tar -xf $zipPath -C $installDir
            if ($LASTEXITCODE -ne 0) {
              Write-Error "NSIS 压缩包解压失败（tar 退出码 $LASTEXITCODE）。"
              exit 1
            }
            $makensis = Get-ChildItem -Path $installDir -Filter "makensis.exe" -Recurse | Select-Object -First 1
            if (-not $makensis) {
              Write-Error "NSIS 解压后未找到 makensis.exe，无法生成安装器。"
              exit 1
            }
            Add-Content $env:GITHUB_PATH $makensis.DirectoryName
            Write-Host "已便携安装 NSIS $version 并加入 PATH：$($makensis.DirectoryName)"
          }

      - name: 打包
        run: ${{ matrix.command }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: 创建发布版本
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 创建标签与 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          {
            echo "> 未签名内部测试包：尚未进行代码签名与公证。"
            echo "> Windows 安装时会触发 SmartScreen、macOS 会触发 Gatekeeper 拦截，需手动放行后方可运行。"
          } > release-notes.md
          gh release create "$tag" release/* \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file release-notes.md \
            --generate-notes
